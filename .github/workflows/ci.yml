name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline test suite
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test (no drive or audio hardware)
        run: swift test --package-path Packages/CDKit
